<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

  <defs>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#07121d" flood-opacity="0.36"/>
    </filter>
    <filter id="goldGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1  0 0.78 0 0 0.62  0 0 0.1 0 0.08  0 0 0 0.95 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cyanGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.1  0 0.9 0 0 0.95  0 0 1 0 1  0 0 0 0.85 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="glassOpen" cx="36%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#f4ffff" stop-opacity="0.95"/>
      <stop offset="18%" stop-color="#b6fff9" stop-opacity="0.9"/>
      <stop offset="52%" stop-color="#2bd4cf" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#087e96" stop-opacity="0.98"/>
    </radialGradient>
    <radialGradient id="glassSelected" cx="34%" cy="25%" r="76%">
      <stop offset="0%" stop-color="#fffdf1" stop-opacity="1"/>
      <stop offset="26%" stop-color="#ffe991" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#f0b73d" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#9c5c05" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glassDone" cx="34%" cy="25%" r="76%">
      <stop offset="0%" stop-color="#f7fff1" stop-opacity="1"/>
      <stop offset="30%" stop-color="#b6ff91" stop-opacity="0.96"/>
      <stop offset="62%" stop-color="#29c466" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#08733d" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glassLocked" cx="34%" cy="25%" r="76%">
      <stop offset="0%" stop-color="#e6edf4" stop-opacity="0.92"/>
      <stop offset="40%" stop-color="#8493a1" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#2e3b49" stop-opacity="0.98"/>
    </radialGradient>
    <linearGradient id="gold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fff4a8"/>
      <stop offset="26%" stop-color="#f8c847"/>
      <stop offset="52%" stop-color="#a86508"/>
      <stop offset="76%" stop-color="#ffd76b"/>
      <stop offset="100%" stop-color="#6b3a05"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#143c73"/>
      <stop offset="1" stop-color="#071b38"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef5ff"/>
      <stop offset="0.5" stop-color="#8897a6"/>
      <stop offset="1" stop-color="#243241"/>
    </linearGradient>
  </defs>

<circle cx="256" cy="256" r="220" fill="none" stroke="#ffe37a" stroke-width="18" opacity=".72" filter="url(#goldGlow)"/>
<circle cx="256" cy="256" r="186" fill="none" stroke="#ffffff" stroke-width="5" opacity=".8"/>
</svg>